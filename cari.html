<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0179BB">
  <title>Cari Karya · Galeri Karya STMM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/halaman/cari.css">
</head>
<body data-halaman="cari">
  <div class="app">
    <!-- Header Layar Cari -->
    <header class="cari-header">
      <h1 class="judul-layar">Cari Karya</h1>
      
      <!-- Kolom Input Pencarian -->
      <div class="kotak-cari">
        <span class="kotak-cari__ikon" id="ikon-cari"></span>
        <input type="search" class="kotak-cari__input" id="input-cari" placeholder="Judul karya atau nama kreator" autocomplete="off" autocorrect="off">
        <button type="button" class="kotak-cari__hapus" id="tombol-hapus-cari" aria-label="Hapus teks pencarian" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Deret Chip Kategori Bergaris -->
      <div class="deret-chip" id="daftar-chip-cari"></div>
    </header>

    <!-- Sub-label & Hasil Pencarian -->
    <div class="label-hasil" id="label-hasil">Karya terbaru</div>
    <main class="daftar-baris" id="daftar-hasil-cari"></main>

    <!-- Bilah Navigasi Bawah -->
    <nav class="nav-bawah" id="nav-bawah" aria-label="Navigasi utama"></nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/halaman/cari.js"></script>
</body>
</html>
